apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
type: Opaque
stringData:
  password: {{ q .GrafanaPassword }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
data:
  datasources.yml: |
{{ indent 4 .Files.datasources }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
data:
  dashboard.yml: |
{{ indent 4 .Files.dashboardProvider }}
{{- range .Dashboards }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .ConfigMap }}
  namespace: {{ $.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
    infra-monitor/dashboard: "true"
data:
  {{ .Key }}: |
{{ indent 4 .Body }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: infra-monitor
      annotations:
        checksum/config: {{ .Checksums.grafana }}
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ index .Images "grafana" }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
{{- with .Ingress.Host }}
            - name: GF_SERVER_ROOT_URL
              value: {{ q (printf "%s://%s/" $.IngressScheme .) }}
{{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-provider
{{- range .Dashboards }}
              - configMap:
                  name: {{ .ConfigMap }}
{{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
{{- with .StorageClass }}
        storageClassName: {{ . }}
{{- end }}
        resources:
          requests:
            storage: {{ .Storage.Grafana }}
{{- with .Ingress.Host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: {{ $.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
{{- with $.Ingress.ClusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ q . }}
{{- end }}
spec:
{{- with $.Ingress.ClassName }}
  ingressClassName: {{ . }}
{{- end }}
{{- if $.IngressTLSSecret }}
  tls:
    - hosts: [{{ q . }}]
      secretName: {{ $.IngressTLSSecret }}
{{- end }}
  rules:
    - host: {{ q . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
{{- end }}
