apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
type: Opaque
stringData:
  password: {{ quote .GrafanaPassword }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
data:
  datasources.yml: |
{{ indent 4 .Files.datasources }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
data:
{{- range $name, $body := .Dashboards }}
  {{ $name }}: |
{{ indent 4 $body }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: infra-monitor
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: infra-monitor
      annotations:
        checksum/config: {{ .Checksums.grafana }}
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ .Images.grafana }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
{{- with .StorageClass }}
        storageClassName: {{ . }}
{{- end }}
        resources:
          requests:
            storage: 1Gi
