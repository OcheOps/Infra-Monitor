apiVersion: v1
kind: Service
metadata:
  name: blackbox
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: blackbox
    app.kubernetes.io/part-of: infra-monitor
spec:
  selector:
    app.kubernetes.io/name: blackbox
  ports:
    - name: http
      port: 9115
      targetPort: 9115
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: blackbox
    app.kubernetes.io/part-of: infra-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox
        app.kubernetes.io/part-of: infra-monitor
    spec:
      containers:
        - name: blackbox
          image: {{ index .Images "blackbox" }}
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
