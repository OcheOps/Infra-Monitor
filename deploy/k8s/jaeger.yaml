apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: infra-monitor
data:
  config.yaml: |
{{ indent 4 .Files.jaeger }}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: infra-monitor
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: thrift-http
      port: 14268
      targetPort: 14268
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: infra-monitor
spec:
  serviceName: jaeger
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: infra-monitor
      annotations:
        checksum/config: {{ .Checksums.jaeger }}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: jaeger
          image: {{ index .Images "jaeger" }}
          args:
            - --config=/etc/jaeger/config.yaml
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: thrift-http
              containerPort: 14268
          readinessProbe:
            httpGet:
              path: /
              port: ui
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
            - name: data
              mountPath: /badger
      volumes:
        - name: config
          configMap:
            name: jaeger-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
{{- with .StorageClass }}
        storageClassName: {{ . }}
{{- end }}
        resources:
          requests:
            storage: {{ .Storage.Jaeger }}
