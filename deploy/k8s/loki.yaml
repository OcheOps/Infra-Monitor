apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: infra-monitor
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: infra-monitor
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: infra-monitor
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: {{ .Images.loki }}
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: data
              mountPath: /loki
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
{{- with .StorageClass }}
        storageClassName: {{ . }}
{{- end }}
        resources:
          requests:
            storage: 10Gi
