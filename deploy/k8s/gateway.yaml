apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: infra-monitor
data:
  Caddyfile: |
{{ indent 4 .Files.gateway }}
  index.html: |
{{ indent 4 .Files.statusHTML }}
  config.json: |
{{ indent 4 .Files.statusJSON }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: infra-monitor
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: infra-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: infra-monitor
      annotations:
        checksum/config: {{ .Checksums.gateway }}
    spec:
      containers:
        - name: caddy
          image: {{ index .Images "gateway" }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: config
              mountPath: /srv/status/index.html
              subPath: index.html
            - name: config
              mountPath: /srv/status/config.json
              subPath: config.json
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: data
          emptyDir: {}
{{- with .PublicHost }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: {{ $.Namespace }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: infra-monitor
  annotations:
    # Agents push metric batches through the gateway (ingress-nginx caps
    # request bodies at 1m by default).
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
{{- with $.Ingress.ClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ q . }}
{{- end }}
spec:
{{- with $.Ingress.ClassName }}
  ingressClassName: {{ . }}
{{- end }}
{{- if $.IngressTLSSecret }}
  tls:
    - hosts:
        - {{ q . }}
{{- with $.StatusDomain }}
        - {{ q . }}
{{- end }}
      secretName: {{ $.IngressTLSSecret }}
{{- end }}
  rules:
{{- range $.IngressHosts }}
    - host: {{ q . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
{{- end }}
{{- end }}
