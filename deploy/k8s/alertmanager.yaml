apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: infra-monitor
type: Opaque
stringData:
  alertmanager.yml: |
{{ indent 4 .Files.alertmanager }}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: infra-monitor
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: infra-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: infra-monitor
      annotations:
        checksum/config: {{ .Checksums.alertmanager }}
    spec:
      containers:
        - name: alertmanager
          image: {{ .Images.alertmanager }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          secret:
            secretName: alertmanager-config
        - name: data
          emptyDir: {}
