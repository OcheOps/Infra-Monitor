[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/syslog,/var/log/messages
    Tag               host.*
    Refresh_Interval  5
    DB                /fluent-bit/db/syslog.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               containers.*
    DB                /fluent-bit/db/containers.db
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

[FILTER]
    Name    modify
    Match   containers.*
    Add     job container-logs

[OUTPUT]
    Name    loki
    Match   host.*
    Host    loki
    Port    3100
    Labels  job=infra-monitor,host=${NODE_HOSTNAME}

[OUTPUT]
    Name    loki
    Match   containers.*
    Host    loki
    Port    3100
    Labels  job=container-logs,host=${NODE_HOSTNAME}
