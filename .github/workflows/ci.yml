name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: 2.54.1
  ALERTMANAGER_VERSION: 0.27.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "INFRA_MONITOR_DIR=$RUNNER_TEMP/im" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: make test
      - run: make build
      - name: Install promtool, amtool and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar xz --strip-components=1 -C bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" | tar xz --strip-components=1 -C bin "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Configure every feature
        run: |
          bin/infra-monitor init --probe https://example.com --probe tcp://db.local:5432 \
            --telegram-token 123:abc --telegram-chat-id -42 \
            --slack-webhook https://hooks.slack.com/services/a/b/c --webhook-url http://hook:9000/x
          bin/infra-monitor notify add email --to ops@example.com --from mon@example.com --smarthost smtp.example.com:587
          bin/infra-monitor targets add web-1 10.0.0.5:9100
          bin/infra-monitor expose --domain mon.example.com --status-domain status.example.com --email ops@example.com
          bin/infra-monitor k8s configure --cluster-issuer letsencrypt
          bin/infra-monitor statuspage enable --title "CI status"
          bin/infra-monitor statuspage add tcp://db.local:5432 --name Database
          bin/infra-monitor agent add web-2
          printf 'groups:\n  - name: custom\n    rules:\n      - alert: Custom\n        expr: up == 2\n' > "$INFRA_MONITOR_DIR/rules/custom.yml"
          echo '{"title":"Custom","panels":[]}' > "$INFRA_MONITOR_DIR/dashboards/custom.json"
      - name: Validate rendered configs
        run: |
          bin/infra-monitor compose sync
          C="$INFRA_MONITOR_DIR/compose"
          promtool check rules "$C"/alerts/*.yml
          sed "s#/etc/prometheus/rules#$C/alerts#" "$C/config/prometheus.yml" > prom.yml
          promtool check config prom.yml
          cp .github/promtool/agents_test.yml "$C/alerts/"
          (cd "$C/alerts" && promtool test rules agents_test.yml && rm agents_test.yml)
          amtool check-config "$C/config/alertmanager.yml"
          docker compose --project-directory "$C" -f "$C/docker-compose.yml" --env-file "$C/.env" config -q
          docker run --rm -v "$C/gateway:/etc/caddy:ro" caddy:2.8.4-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
          bin/infra-monitor k8s render > k8s.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 k8s.yaml
      - name: Shellcheck
        run: shellcheck install.sh packaging/*.sh .github/scripts/*.sh
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Install the .deb
        run: |
          sudo dpkg -i dist/*_amd64.deb
          infra-monitor version
          test -f /usr/share/bash-completion/completions/infra-monitor
          sudo dpkg -r infra-monitor
      - name: install.sh against the snapshot
        run: |
          archive=$(ls dist/infra-monitor_*_linux_amd64.tar.gz)
          version="v$(basename "$archive" | sed 's/^infra-monitor_\(.*\)_linux_amd64.tar.gz$/\1/')"
          python3 .github/scripts/fake-release-server.py dist "$version" 8765 >/dev/null 2>&1 &
          server=$!
          for _ in $(seq 20); do curl -fsSI -o /dev/null http://127.0.0.1:8765/latest && break; sleep 0.5; done
          kill -0 "$server"   # fail if our server didn't start (e.g. port taken)
          export INFRA_MONITOR_BASE_URL=http://127.0.0.1:8765
          INFRA_MONITOR_INSTALL_DIR="$RUNNER_TEMP/latest" sh install.sh
          "$RUNNER_TEMP/latest/infra-monitor" version
          INFRA_MONITOR_INSTALL_DIR="$RUNNER_TEMP/pinned" INFRA_MONITOR_VERSION="$version" sh install.sh
          sed -i 's/^[0-9a-f]\{8\}/00000000/' dist/checksums.txt
          if INFRA_MONITOR_INSTALL_DIR="$RUNNER_TEMP/bad" sh install.sh; then
            echo "::error::install.sh accepted a bad checksum"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/bad/infra-monitor"
          kill "$server"

  compose-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "INFRA_MONITOR_DIR=$RUNNER_TEMP/im" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - name: Configure (probe Grafana from inside the stack)
        run: |
          bin/infra-monitor init --probe http://grafana:3000/api/health --retention-logs 7d
          bin/infra-monitor targets add blackbox-self blackbox:9115
          bin/infra-monitor statuspage enable
      - run: bin/infra-monitor compose up
      - name: Wait for scrape targets
        run: .github/scripts/wait-for-targets.sh "curl -fsS http://localhost:9090/api/v1/targets" prometheus node cadvisor alertmanager blackbox blackbox-self
      - name: Probe and alert rules work
        run: |
          .github/scripts/wait-for-query.sh "curl -fsS" 'probe_success{instance="http://grafana:3000/api/health"}'
          .github/scripts/wait-for-query.sh "curl -fsS" 'count(prometheus_rule_group_rules) > 0'
      - name: Grafana, Loki and Jaeger work
        run: |
          curl -fsS http://localhost:3000/api/health
          for _ in $(seq 30); do curl -fsS http://localhost:3100/ready && break; sleep 5; done
          trace=$(openssl rand -hex 16); now=$(date +%s%N)
          curl -fsS -H 'Content-Type: application/json' http://localhost:4318/v1/traces -d "{\"resourceSpans\":[{\"resource\":{\"attributes\":[{\"key\":\"service.name\",\"value\":{\"stringValue\":\"ci\"}}]},\"scopeSpans\":[{\"spans\":[{\"traceId\":\"$trace\",\"spanId\":\"0123456789abcdef\",\"name\":\"ci\",\"kind\":1,\"startTimeUnixNano\":\"$now\",\"endTimeUnixNano\":\"$((now+1000000))\"}]}]}]}"
          for _ in $(seq 20); do curl -fsS "http://localhost:16686/api/traces/$trace" | jq -e '.data | length == 1' && exit 0; sleep 3; done
          echo "trace not found in Jaeger"; exit 1
      - name: notify test reaches Alertmanager
        run: bin/infra-monitor notify test
      - name: Status page serves only its fixed queries
        run: |
          base=http://localhost:8081/status
          curl -fsS "$base/" | grep -q "<title>"
          curl -fsS "$base/config.json" | jq -e '.monitors | length == 1'
          for _ in $(seq 30); do
            curl -fsS "$base/api/now" | jq -e '.data.result | length == 1 and .[0].value[1] == "1"' && break
            sleep 5
          done
          curl -fsS "$base/api/now" | jq -e '.data.result | length == 1'
          # A client must never get its own query run.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data 'query=count(up)' "$base/api/now")" = 405
          curl -fsS -X GET --data 'query=count(up)' "$base/api/now" | jq -e 'all(.data.result[]; .metric.__name__ == "probe_success")'
          curl -fsS "$base/api/now?query=count(up)" | jq -e 'all(.data.result[]; .metric.__name__ == "probe_success")'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/v1/query?query=up")" = 404
      - name: expose serves Grafana and the status page over HTTPS
        run: |
          bin/infra-monitor expose --domain localhost --tls internal
          bin/infra-monitor compose up
          for _ in $(seq 30); do curl -kfsS https://localhost/api/health && break; sleep 2; done
          curl -kfsS https://localhost/api/health | jq -e '.database == "ok"'
          curl -kfsS https://localhost/status/ | grep -q "<title>"
          curl -kfsS https://localhost/status/api/now | jq -e '.data.result | length == 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
      - name: An agent on the same runner sends metrics and logs
        run: |
          echo "127.0.0.1 mon.test" | sudo tee -a /etc/hosts
          bin/infra-monitor expose --domain mon.test --tls internal
          bin/infra-monitor compose up
          for _ in $(seq 30); do curl -kfsS -o /dev/null https://mon.test/api/health && break; sleep 2; done
          bin/infra-monitor agent add ci-agent | tee add.txt
          bin/infra-monitor compose up
          join=$(grep -o 'infra-monitor agent join .*' add.txt)
          # The agent's containers reach the server through the Docker host.
          # shellcheck disable=SC2086
          INFRA_MONITOR_DIR="$RUNNER_TEMP/agent" bin/${join} --server-ip host-gateway
          INFRA_MONITOR_DIR="$RUNNER_TEMP/agent" bin/infra-monitor doctor
          .github/scripts/wait-for-query.sh "curl -fsS" 'up{agent="ci-agent",job="node"}'
          .github/scripts/wait-for-query.sh "curl -fsS" 'count(node_cpu_seconds_total{instance="ci-agent"})'
          for _ in $(seq 30); do
            curl -fsS http://localhost:3100/loki/api/v1/label/agent/values | jq -e 'index("ci-agent") != null' && exit 0
            sleep 5
          done
          echo "no logs from ci-agent in Loki"; exit 1
      - name: Logs on failure
        if: failure()
        run: |
          bin/infra-monitor compose status
          docker compose -p infra-monitor logs --tail 50
          docker compose -p infra-monitor-agent logs --tail 50 || true

  k8s-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "INFRA_MONITOR_DIR=$RUNNER_TEMP/im" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.10.0
      - run: make build
      - run: bin/infra-monitor init --probe http://grafana:3000/api/health
      - run: bin/infra-monitor statuspage enable
      - run: bin/infra-monitor k8s apply
      - name: Wait for rollouts
        run: |
          for w in statefulset/prometheus statefulset/grafana statefulset/loki statefulset/jaeger \
                   deployment/alertmanager deployment/blackbox deployment/kube-state-metrics deployment/gateway \
                   daemonset/node-exporter daemonset/fluent-bit; do
            kubectl -n infra-monitor rollout status "$w" --timeout=300s
          done
      - name: Wait for scrape targets
        run: .github/scripts/wait-for-targets.sh "kubectl -n infra-monitor exec prometheus-0 -- wget -qO- http://localhost:9090/api/v1/targets" prometheus node kubelet cadvisor alertmanager kube-state-metrics blackbox
      - name: Queries return data
        run: |
          q=".github/scripts/wait-for-query.sh"; exec="kubectl -n infra-monitor exec prometheus-0 -- wget -qO-"
          $q "$exec" 'probe_success{instance="http://grafana:3000/api/health"}'
          $q "$exec" 'count(kube_pod_info{namespace="infra-monitor"})'
          $q "$exec" 'count(prometheus_rule_group_rules{rule_group=~".*kubernetes.*"})'
      - name: Status page through the gateway
        run: |
          for _ in $(seq 30); do
            kubectl -n infra-monitor exec prometheus-0 -- wget -qO- http://gateway/status/api/now | jq -e '.data.result | length == 1' && break
            sleep 5
          done
          kubectl -n infra-monitor exec prometheus-0 -- wget -qO- http://gateway/status/api/now | jq -e '.data.result | length == 1'
          kubectl -n infra-monitor exec prometheus-0 -- wget -qO- http://gateway/status/ | grep -q "<title>"
      - name: Logs arrive in Loki
        run: |
          for _ in $(seq 30); do
            out=$(kubectl -n infra-monitor exec prometheus-0 -- wget -qO- 'http://loki:3100/loki/api/v1/labels' || true)
            echo "$out" | grep -q kubernetes_namespace_name && { echo "$out"; exit 0; }
            sleep 5
          done
          echo "no Kubernetes log labels in Loki: $out"; exit 1
      - name: Re-apply after a config change rolls only what changed
        run: |
          bin/infra-monitor probes add http://prometheus:9090/-/healthy
          bin/infra-monitor k8s apply
          kubectl -n infra-monitor rollout status statefulset/prometheus --timeout=300s
          .github/scripts/wait-for-query.sh "kubectl -n infra-monitor exec prometheus-0 -- wget -qO-" 'probe_success{instance="http://prometheus:9090/-/healthy"}'
      - name: Debug on failure
        if: failure()
        run: |
          bin/infra-monitor k8s status
          kubectl -n infra-monitor get events --sort-by=.lastTimestamp | tail -40
          for w in daemonset/fluent-bit statefulset/jaeger deployment/kube-state-metrics statefulset/loki; do
            echo "== $w"; kubectl -n infra-monitor logs "$w" --tail 30 || true
          done
