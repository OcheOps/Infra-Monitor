name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: 2.54.1
  ALERTMANAGER_VERSION: 0.27.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "INFRA_MONITOR_DIR=$RUNNER_TEMP/im" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: make test
      - run: make build
      - name: Install promtool, amtool and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar xz --strip-components=1 -C bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" | tar xz --strip-components=1 -C bin "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Configure every feature
        run: |
          bin/infra-monitor init --probe https://example.com --probe tcp://db.local:5432 \
            --telegram-token 123:abc --telegram-chat-id -42 \
            --slack-webhook https://hooks.slack.com/services/a/b/c --webhook-url http://hook:9000/x
          bin/infra-monitor notify add email --to ops@example.com --from mon@example.com --smarthost smtp.example.com:587
          bin/infra-monitor targets add web-1 10.0.0.5:9100
          bin/infra-monitor k8s configure --ingress-host grafana.example.com --cluster-issuer letsencrypt
          printf 'groups:\n  - name: custom\n    rules:\n      - alert: Custom\n        expr: up == 2\n' > "$INFRA_MONITOR_DIR/rules/custom.yml"
          echo '{"title":"Custom","panels":[]}' > "$INFRA_MONITOR_DIR/dashboards/custom.json"
      - name: Validate rendered configs
        run: |
          bin/infra-monitor compose sync
          C="$INFRA_MONITOR_DIR/compose"
          promtool check rules "$C"/alerts/*.yml
          sed "s#/etc/prometheus/rules#$C/alerts#" "$C/config/prometheus.yml" > prom.yml
          promtool check config prom.yml
          amtool check-config "$C/config/alertmanager.yml"
          docker compose --project-directory "$C" -f "$C/docker-compose.yml" --env-file "$C/.env" config -q
          bin/infra-monitor k8s render > k8s.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 k8s.yaml
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=before

  compose-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "INFRA_MONITOR_DIR=$RUNNER_TEMP/im" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - name: Configure (probe Grafana from inside the stack)
        run: |
          bin/infra-monitor init --probe http://grafana:3000/api/health --retention-logs 7d
          bin/infra-monitor targets add blackbox-self blackbox:9115
      - run: bin/infra-monitor compose up
      - name: Wait for scrape targets
        run: .github/scripts/wait-for-targets.sh "curl -fsS http://localhost:9090/api/v1/targets" prometheus node cadvisor alertmanager blackbox blackbox-self
      - name: Probe and alert rules work
        run: |
          .github/scripts/wait-for-query.sh "curl -fsS" 'probe_success{instance="http://grafana:3000/api/health"}'
          .github/scripts/wait-for-query.sh "curl -fsS" 'count(prometheus_rule_group_rules) > 0'
      - name: Grafana, Loki and Jaeger work
        run: |
          curl -fsS http://localhost:3000/api/health
          for i in $(seq 30); do curl -fsS http://localhost:3100/ready && break; sleep 5; done
          trace=$(openssl rand -hex 16); now=$(date +%s%N)
          curl -fsS -H 'Content-Type: application/json' http://localhost:4318/v1/traces -d "{\"resourceSpans\":[{\"resource\":{\"attributes\":[{\"key\":\"service.name\",\"value\":{\"stringValue\":\"ci\"}}]},\"scopeSpans\":[{\"spans\":[{\"traceId\":\"$trace\",\"spanId\":\"0123456789abcdef\",\"name\":\"ci\",\"kind\":1,\"startTimeUnixNano\":\"$now\",\"endTimeUnixNano\":\"$((now+1000000))\"}]}]}]}"
          for i in $(seq 20); do curl -fsS "http://localhost:16686/api/traces/$trace" | jq -e '.data | length == 1' && exit 0; sleep 3; done
          echo "trace not found in Jaeger"; exit 1
      - name: notify test reaches Alertmanager
        run: bin/infra-monitor notify test
      - name: Logs on failure
        if: failure()
        run: |
          bin/infra-monitor compose status
          docker compose -p infra-monitor logs --tail 50

  k8s-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "INFRA_MONITOR_DIR=$RUNNER_TEMP/im" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.10.0
      - run: make build
      - run: bin/infra-monitor init --probe http://grafana:3000/api/health
      - run: bin/infra-monitor k8s apply
      - name: Wait for rollouts
        run: |
          for w in statefulset/prometheus statefulset/grafana statefulset/loki statefulset/jaeger \
                   deployment/alertmanager deployment/blackbox deployment/kube-state-metrics \
                   daemonset/node-exporter daemonset/fluent-bit; do
            kubectl -n infra-monitor rollout status "$w" --timeout=300s
          done
      - name: Wait for scrape targets
        run: .github/scripts/wait-for-targets.sh "kubectl -n infra-monitor exec prometheus-0 -- wget -qO- http://localhost:9090/api/v1/targets" prometheus node kubelet cadvisor alertmanager kube-state-metrics blackbox
      - name: Queries return data
        run: |
          q=".github/scripts/wait-for-query.sh"; exec="kubectl -n infra-monitor exec prometheus-0 -- wget -qO-"
          $q "$exec" 'probe_success{instance="http://grafana:3000/api/health"}'
          $q "$exec" 'count(kube_pod_info{namespace="infra-monitor"})'
          $q "$exec" 'count(prometheus_rule_group_rules{rule_group=~".*kubernetes.*"})'
      - name: Logs arrive in Loki
        run: |
          for i in $(seq 30); do
            out=$(kubectl -n infra-monitor exec prometheus-0 -- wget -qO- 'http://loki:3100/loki/api/v1/labels' || true)
            echo "$out" | grep -q kubernetes_namespace_name && { echo "$out"; exit 0; }
            sleep 5
          done
          echo "no Kubernetes log labels in Loki: $out"; exit 1
      - name: Re-apply after a config change rolls only what changed
        run: |
          bin/infra-monitor probes add http://prometheus:9090/-/healthy
          bin/infra-monitor k8s apply
          kubectl -n infra-monitor rollout status statefulset/prometheus --timeout=300s
          .github/scripts/wait-for-query.sh "kubectl -n infra-monitor exec prometheus-0 -- wget -qO-" 'probe_success{instance="http://prometheus:9090/-/healthy"}'
      - name: Debug on failure
        if: failure()
        run: |
          bin/infra-monitor k8s status
          kubectl -n infra-monitor get events --sort-by=.lastTimestamp | tail -40
          for w in daemonset/fluent-bit statefulset/jaeger deployment/kube-state-metrics statefulset/loki; do
            echo "== $w"; kubectl -n infra-monitor logs "$w" --tail 30 || true
          done
