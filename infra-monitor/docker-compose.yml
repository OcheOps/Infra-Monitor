name: infra-monitor

x-restart: &restart
  restart: unless-stopped

networks:
  monitor:

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  jaeger-data:

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    <<: *restart
    networks: [monitor]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./alerts/rules.yml:/etc/prometheus/rules.yml:ro,z
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: *restart
    networks: [monitor]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.2.2
    <<: *restart
    networks: [monitor]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro,z
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,z

  node-exporter:
    image: prom/node-exporter:v1.8.2
    <<: *restart
    networks: [monitor]
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    <<: *restart
    networks: [monitor]
    ports:
      - "127.0.0.1:9115:9115"

  loki:
    image: grafana/loki:3.1.1
    <<: *restart
    networks: [monitor]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  fluentbit:
    image: cr.fluentbit.io/fluent/fluent-bit:3.1.7
    <<: *restart
    networks: [monitor]
    command: /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.conf
    environment:
      - NODE_HOSTNAME=${HOSTNAME:-node}
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./config/fluentbit.conf:/fluent-bit/etc/fluent-bit.conf:ro,z
      - ./config/parsers.conf:/fluent-bit/etc/parsers.conf:ro,z
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.60
    <<: *restart
    networks: [monitor]
    user: root
    environment:
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:14268:14268"
      - "127.0.0.1:4317:4317"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    <<: *restart
    networks: [monitor]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8080:8080"
